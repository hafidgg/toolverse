name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toolverse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toolverse_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/toolverse_test
      ADMIN_SESSION_SECRET: ci-test-secret-please-override-in-real-envs-0000000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workaround for npm/cli#4828: package-lock.json was generated on Windows
      # and omits the Linux optional binaries, so Vitest fails with "Cannot find
      # module @rollup/rollup-linux-x64-gnu". Install it at the exact rollup
      # version pinned in the lockfile, without touching the lockfile.
      # Follow-up: regenerate package-lock.json with all platform binaries and
      # drop this step.
      - name: Install Linux Rollup binary (npm/cli#4828 workaround)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.62.4

      - name: Prisma generate
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    # Throwaway CI-only database; seeded with the repo's content fixtures so
    # E2E tests have real published tool slugs. Never points at production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toolverse_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toolverse_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/toolverse_e2e
      ADMIN_SESSION_SECRET: ci-test-secret-please-override-in-real-envs-0000000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm/cli#4828 workaround; see the lint-typecheck-test job above.
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.62.4
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed:content
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
